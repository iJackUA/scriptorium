{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scriptorium</title>
  {{/* Tom Select's vendored stylesheet comes first so app.css can restyle its
       controls onto the design tokens; both are unlayered, so order decides. */}}
  <link rel="stylesheet" href="/static/tom-select.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/tom-select.min.js" defer></script>
</head>
<body class="bg-base-200 text-base-content font-sans min-h-screen">
  <div id="app">{{.}}</div>
  <script>
    function languageControls(root) {
      root.querySelectorAll('select.language-select').forEach(function (select) {
        if (select.tomselect) return;
        var dialog = select.closest('dialog');
        var control = new TomSelect(select, {create: false, searchField: ['text', 'value'], dropdownParent: dialog || undefined});
        // Tom Select copies the original element's classes onto its wrapper.
        // The daisyUI field chrome is there for the unenhanced select, and
        // would otherwise draw a second frame around the control it builds.
        control.wrapper.classList.remove('select');
        if (dialog) control.on('dropdown_open', function (dropdown) {
          var rect = control.control.getBoundingClientRect();
          dropdown.style.position = 'fixed';
          dropdown.style.top = rect.bottom + 'px';
          dropdown.style.left = rect.left + 'px';
          dropdown.style.width = rect.width + 'px';
        });
      });
    }
    document.addEventListener('DOMContentLoaded', function () { languageControls(document); openRenderedModals(document); });
    function openRenderedModals(root) { root.querySelectorAll('dialog[data-open-on-render]').forEach(function (dialog) { dialog.showModal(); }); }
    document.body.addEventListener('htmx:afterSwap', function (event) { languageControls(event.target); openRenderedModals(event.target); });
    function syncBookSource() { var series = document.querySelector('select[name="series"]'), source = document.querySelector('#book-source-language'); if (series && source) source.disabled = series.value !== ''; }
    document.addEventListener('change', function (event) { if (event.target.name === 'series') syncBookSource(); });
    document.addEventListener('DOMContentLoaded', syncBookSource);
    document.body.addEventListener('htmx:afterSwap', syncBookSource);
  </script>
</body>
</html>{{end}}
