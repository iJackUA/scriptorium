{{define "welcome"}}
<div class="hero">
  <div class="hero-content flex-col max-w-xl text-center gap-6">
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl font-semibold">Choose a workspace folder</h1>
      <p class="opacity-70">
        Your whole library — every Series, Book and translation — lives as plain
        files under one folder, on whichever drive you like. Back it up, sync it,
        or edit it by hand; Scriptorium reads it either way.
      </p>
    </div>

    {{with .Problem}}
      <div role="alert" data-testid="workspace-problem" class="alert alert-warning text-left">
        <span>{{.}}</span>
      </div>
    {{end}}

    <button class="btn btn-primary"
            hx-post="/workspace"
            hx-target="#app"
            hx-swap="innerHTML">
      Choose folder…
    </button>
  </div>
</div>
{{end}}
