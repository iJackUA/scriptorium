{{define "book-detail"}}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body gap-3">
    <h2 class="card-title">{{.Book.Title}}</h2>
    <p class="text-sm opacity-70">{{.Book.Author}}</p>
    <dl class="text-sm grid grid-cols-[auto_1fr] gap-x-4 gap-y-1">
      <dt class="opacity-60">Book Code</dt><dd><code>{{.Book.Code}}</code></dd>
      <dt class="opacity-60">Series</dt><dd>{{.Series.Name}}</dd>
      <dt class="opacity-60">Source language</dt><dd>{{.Series.SourceLanguage}}</dd>
    </dl>
    <div class="divider my-1">Translation Targets</div>
    <ul class="flex flex-col gap-2">
      {{range .Book.Targets}}
        <li class="flex items-center justify-between">
          <span>{{.Language}}</span>
          <span class="badge {{template "status-class" .Status}}">{{.Status}}</span>
        </li>
      {{end}}
    </ul>
  </div>
</div>
{{end}}
